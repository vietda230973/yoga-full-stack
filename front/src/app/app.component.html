<div class="app">
  <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <span>Yoga app</span>
    @if (isLogged$ | async) {
      <a routerLink="/sessions" routerLinkActive="active" class="link">Sessions</a>
      <a routerLink="/me" routerLinkActive="active" class="link">Account</a>
      <button mat-button type="button" (click)="logout()">Logout</button>
    } @else {
      <div>
        <a  routerLink="/login" routerLinkActive="active" class="link">Login</a>
        <a routerLink="/register" routerLinkActive="active" class="link">Register</a>
      </div>
    }
  </mat-toolbar>
  <div>
    <router-outlet></router-outlet>
  </div>
</div>
